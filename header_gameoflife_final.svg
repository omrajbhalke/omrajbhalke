<svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="100" fill="#0d1117"/>

  <!-- Grid lines -->
  <g stroke="#1F61A5" stroke-width="0.2" opacity="0.15">
    <line x1="0" y1="10" x2="800" y2="10"/><line x1="0" y1="20" x2="800" y2="20"/>
    <line x1="0" y1="30" x2="800" y2="30"/><line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="70" x2="800" y2="70"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="10"  y1="0" x2="10"  y2="100"/><line x1="20"  y1="0" x2="20"  y2="100"/>
    <line x1="30"  y1="0" x2="30"  y2="100"/><line x1="40"  y1="0" x2="40"  y2="100"/>
    <line x1="50"  y1="0" x2="50"  y2="100"/><line x1="60"  y1="0" x2="60"  y2="100"/>
    <line x1="70"  y1="0" x2="70"  y2="100"/><line x1="80"  y1="0" x2="80"  y2="100"/>
    <line x1="90"  y1="0" x2="90"  y2="100"/><line x1="100" y1="0" x2="100" y2="100"/>
    <line x1="110" y1="0" x2="110" y2="100"/><line x1="120" y1="0" x2="120" y2="100"/>
    <line x1="130" y1="0" x2="130" y2="100"/><line x1="140" y1="0" x2="140" y2="100"/>
    <line x1="150" y1="0" x2="150" y2="100"/><line x1="160" y1="0" x2="160" y2="100"/>
    <line x1="170" y1="0" x2="170" y2="100"/><line x1="180" y1="0" x2="180" y2="100"/>
    <line x1="190" y1="0" x2="190" y2="100"/><line x1="200" y1="0" x2="200" y2="100"/>
    <line x1="210" y1="0" x2="210" y2="100"/><line x1="220" y1="0" x2="220" y2="100"/>
    <line x1="230" y1="0" x2="230" y2="100"/><line x1="240" y1="0" x2="240" y2="100"/>
    <line x1="250" y1="0" x2="250" y2="100"/><line x1="260" y1="0" x2="260" y2="100"/>
    <line x1="270" y1="0" x2="270" y2="100"/><line x1="280" y1="0" x2="280" y2="100"/>
    <line x1="290" y1="0" x2="290" y2="100"/><line x1="300" y1="0" x2="300" y2="100"/>
    <line x1="310" y1="0" x2="310" y2="100"/><line x1="320" y1="0" x2="320" y2="100"/>
    <line x1="330" y1="0" x2="330" y2="100"/><line x1="340" y1="0" x2="340" y2="100"/>
    <line x1="350" y1="0" x2="350" y2="100"/><line x1="360" y1="0" x2="360" y2="100"/>
    <line x1="370" y1="0" x2="370" y2="100"/><line x1="380" y1="0" x2="380" y2="100"/>
    <line x1="390" y1="0" x2="390" y2="100"/><line x1="400" y1="0" x2="400" y2="100"/>
    <line x1="410" y1="0" x2="410" y2="100"/><line x1="420" y1="0" x2="420" y2="100"/>
    <line x1="430" y1="0" x2="430" y2="100"/><line x1="440" y1="0" x2="440" y2="100"/>
    <line x1="450" y1="0" x2="450" y2="100"/><line x1="460" y1="0" x2="460" y2="100"/>
    <line x1="470" y1="0" x2="470" y2="100"/><line x1="480" y1="0" x2="480" y2="100"/>
    <line x1="490" y1="0" x2="490" y2="100"/><line x1="500" y1="0" x2="500" y2="100"/>
    <line x1="510" y1="0" x2="510" y2="100"/><line x1="520" y1="0" x2="520" y2="100"/>
    <line x1="530" y1="0" x2="530" y2="100"/><line x1="540" y1="0" x2="540" y2="100"/>
    <line x1="550" y1="0" x2="550" y2="100"/><line x1="560" y1="0" x2="560" y2="100"/>
    <line x1="570" y1="0" x2="570" y2="100"/><line x1="580" y1="0" x2="580" y2="100"/>
    <line x1="590" y1="0" x2="590" y2="100"/><line x1="600" y1="0" x2="600" y2="100"/>
    <line x1="610" y1="0" x2="610" y2="100"/><line x1="620" y1="0" x2="620" y2="100"/>
    <line x1="630" y1="0" x2="630" y2="100"/><line x1="640" y1="0" x2="640" y2="100"/>
    <line x1="650" y1="0" x2="650" y2="100"/><line x1="660" y1="0" x2="660" y2="100"/>
    <line x1="670" y1="0" x2="670" y2="100"/><line x1="680" y1="0" x2="680" y2="100"/>
    <line x1="690" y1="0" x2="690" y2="100"/><line x1="700" y1="0" x2="700" y2="100"/>
    <line x1="710" y1="0" x2="710" y2="100"/><line x1="720" y1="0" x2="720" y2="100"/>
    <line x1="730" y1="0" x2="730" y2="100"/><line x1="740" y1="0" x2="740" y2="100"/>
    <line x1="750" y1="0" x2="750" y2="100"/><line x1="760" y1="0" x2="760" y2="100"/>
    <line x1="770" y1="0" x2="770" y2="100"/><line x1="780" y1="0" x2="780" y2="100"/>
    <line x1="790" y1="0" x2="790" y2="100"/>
