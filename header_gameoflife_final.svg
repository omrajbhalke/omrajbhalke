  <!-- Glider 1 — animates across -->
  <g filter="url(#glow)">
    <g>
      <!-- glider pattern: cells cycle through life -->
      <rect width="8" height="8" fill="#1F61A5" rx="1"><animate attributeName="x" values="20;790" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="10;10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;1;1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect width="8" height="8" fill="#2a7fd4" rx="1"><animate attributeName="x" values="30;800" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="10;10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;1;0;1;1" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect width="8" height="8" fill="#1F61A5" rx="1"><animate attributeName="x" values="30;800" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="20;20" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;1;1;0" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect width="8" height="8" fill="#2a7fd4" rx="1"><animate attributeName="x" values="20;790" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="30;30" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0;1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect width="8" height="8" fill="#5ba3e0" rx="1"><animate attributeName="x" values="30;800" dur="8s" repeatCount="indefinite"/><animate attributeName="y" values="30;30" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1;0;0;1;1" dur="0.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Static interesting patterns — oscillators / still lifes -->
  <!-- Blinker at 200,40 -->
  <g fill="#1F61A5" filter="url(#glow)">
    <rect x="201" y="41" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="211" y="41" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="221" y="41" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="211" y="31" width="8" height="8" rx="1"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="211" y="51" width="8" height="8" rx="1"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <!-- Block still life at 400 -->
  <g fill="#2a7fd4" filter="url(#glow)" opacity="0.8">
    <rect x="401" y="31" width="8" height="8" rx="1"/>
    <rect x="411" y="31" width="8" height="8" rx="1"/>
    <rect x="401" y="41" width="8" height="8" rx="1"/>
    <rect x="411" y="41" width="8" height="8" rx="1"/>
  </g>
  <!-- Toad at 550 -->
  <g fill="#5ba3e0" filter="url(#glow)">
    <rect x="551" y="51" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="561" y="51" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="571" y="51" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="541" y="61" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="551" y="61" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="561" y="61" width="8" height="8" rx="1"><animate attributeName="opacity" values="1;0;1" dur="1.4s" repeatCount="indefinite"/></rect>
  </g>
  <!-- scattered random cells -->
  <g fill="#1F61A5" opacity="0.5">
    <rect x="101" y="21" width="8" height="8" rx="1"><animate attributeName="opacity" values="0.5;0;0.5" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="121" y="61" width="8" height="8" rx="1"><animate attributeName="opacity" values="0;0.6;0" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="651" y="71" width="8" height="8" rx="1"><animate attributeName="opacity" values="0.4;0;0.4" dur="2.3s" repeatCount="indefinite"/></rect>
    <rect x="701" y="31" width="8" height="8" rx="1"><animate attributeName="opacity" values="0;0.5;0" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="751" y="51" width="8" height="8" rx="1"><animate attributeName="opacity" values="0.3;0;0.3" dur="2.5s" repeatCount="indefinite"/></rect>
  </g>

  <line x1="0" y1="0" x2="800" y2="0" stroke="#1F61A5" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
</svg>
